<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Your Event | CampusFlow</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 32px 16px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 28px;
        }

        .page-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .page-header p {
            color: #9ca3af;
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 14px;
            background: #1c1c1c;
            color: #f5f5f5;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #22c55e;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .toggle-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 9px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1c1c1c;
            color: #d1d5db;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-btn.active {
            border-color: #22c55e;
            background: #16a34a;
            color: white;
        }

        .current-image {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .upload-area {
            border: 1px dashed #333;
            border-radius: 4px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            background: #1c1c1c;
        }

        .upload-area:hover {
            border-color: #22c55e;
        }

        .upload-area p {
            color: #9ca3af;
            font-size: 13px;
        }

        #flyerInput {
            display: none;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .save-btn:hover:not(:disabled) {
            background: #15803d;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 10px 14px;
            border-radius: 4px;
            margin-top: 14px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        small {
            color: #9ca3af;
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }

        .center-state {
            text-align: center;
            padding: 40px 0;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .row-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div id="loadingState" class="center-state">
            <p>Loading your event...</p>
        </div>

        <div id="notFoundState" class="center-state" style="display:none;">
            <p>We couldn't find an event for this link. Double check the link is complete and hasn't been altered.</p>
        </div>

        <div id="editWrapper" style="display:none;">
            <div class="page-header">
                <h1 id="eventTitleHeader">Edit Your Event</h1>
                <p>Changes go live right away — no re-approval needed for edits.</p>
            </div>

            <img id="currentImage" class="current-image" style="display:none;" />

            <form id="editForm">
                <div class="form-group">
                    <label for="title">Event Title</label>
                    <input type="text" id="title" required />
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"></textarea>
                </div>

                <div class="form-group">
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" required />
                </div>

                <div class="form-group">
                    <label for="eventDate">Date &amp; Time</label>
                    <input type="datetime-local" id="eventDate" required />
                </div>

                <div class="form-group">
                    <label>Free or Ticketed</label>
                    <div class="toggle-group">
                        <button type="button" class="toggle-btn" id="freeToggleBtn" data-value="free">Free</button>
                        <button type="button" class="toggle-btn" id="ticketToggleBtn" data-value="ticket">Ticketed</button>
                    </div>
                </div>

                <div class="form-group" id="priceGroup" style="display:none;">
                    <label for="price">Ticket Price (₦)</label>
                    <input type="number" id="price" min="0" step="100" />
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="music">Music</option>
                        <option value="tech">Tech</option>
                        <option value="sports">Sports</option>
                        <option value="social">Social</option>
                        <option value="academic">Academic</option>
                    </select>
                </div>

                <div class="form-group" id="bankGroup" style="display:none;">
                    <label>Payout Details</label>
                    <div class="row-group">
                        <input type="text" id="bankName" placeholder="Bank Name" />
                        <input type="text" id="accountName" placeholder="Account Name" />
                    </div>
                    <input type="text" id="accountNumber" placeholder="Account Number" style="margin-top:8px;" />
                </div>

                <div class="form-group">
                    <label>Replace Flyer/Banner (optional)</label>
                    <div class="upload-area" id="uploadArea">
                        <p>Click to choose a new image</p>
                        <p id="fileNameDisplay" style="margin-top:4px; font-size:12px;"></p>
                    </div>
                    <input type="file" id="flyerInput" accept="image/png,image/jpeg,image/jpg" />
                    <small>Leave this alone to keep your current image.</small>
                </div>

                <button type="submit" class="save-btn" id="saveBtn">Save Changes</button>
                <div class="message" id="message"></div>
            </form>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://yfwxwqvksdsugxizaksj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vvacDvbRi-H7XcBesuCmmw_rcTe6gwO';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const loadingState = document.getElementById('loadingState');
        const notFoundState = document.getElementById('notFoundState');
        const editWrapper = document.getElementById('editWrapper');
        const editForm = document.getElementById('editForm');
        const saveBtn = document.getElementById('saveBtn');
        const messageEl = document.getElementById('message');

        let currentEvent = null;
        let isFree = true;
        let selectedFile = null;

        const freeToggleBtn = document.getElementById('freeToggleBtn');
        const ticketToggleBtn = document.getElementById('ticketToggleBtn');
        const priceGroup = document.getElementById('priceGroup');
        const bankGroup = document.getElementById('bankGroup');

        freeToggleBtn.addEventListener('click', function() {
            isFree = true;
            freeToggleBtn.classList.add('active');
            ticketToggleBtn.classList.remove('active');
            priceGroup.style.display = 'none';
            bankGroup.style.display = 'none';
        });

        ticketToggleBtn.addEventListener('click', function() {
            isFree = false;
            ticketToggleBtn.classList.add('active');
            freeToggleBtn.classList.remove('active');
            priceGroup.style.display = 'block';
            bankGroup.style.display = 'block';
        });

        const uploadArea = document.getElementById('uploadArea');
        const flyerInput = document.getElementById('flyerInput');
        uploadArea.addEventListener('click', function() { flyerInput.click(); });
        flyerInput.addEventListener('change', function() {
            if (flyerInput.files && flyerInput.files[0]) {
                selectedFile = flyerInput.files[0];
                document.getElementById('fileNameDisplay').textContent = selectedFile.name;
            }
        });

        function toLocalDatetimeValue(isoString) {
            const d = new Date(isoString);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        async function loadEvent() {
            if (!token) {
                loadingState.style.display = 'none';
                notFoundState.style.display = 'block';
                return;
            }

            try {
                const { data, error } = await sb
                    .from('events')
                    .select('*')
                    .eq('edit_token', token)
                    .single();

                if (error || !data) throw error || new Error('Not found');

                currentEvent = data;

                document.getElementById('eventTitleHeader').textContent = 'Edit: ' + data.title;
                document.getElementById('title').value = data.title || '';
                document.getElementById('description').value = data.description || '';
                document.getElementById('venue').value = data.venue || '';
                document.getElementById('eventDate').value = toLocalDatetimeValue(data.event_date);
                document.getElementById('category').value = data.category || 'social';
                document.getElementById('bankName').value = data.bank_name || '';
                document.getElementById('accountName').value = data.account_name || '';
                document.getElementById('accountNumber').value = data.account_number || '';
                document.getElementById('price').value = data.price || '';

                isFree = !!data.is_free;
                if (isFree) {
                    freeToggleBtn.classList.add('active');
                    priceGroup.style.display = 'none';
                    bankGroup.style.display = 'none';
                } else {
                    ticketToggleBtn.classList.add('active');
                    priceGroup.style.display = 'block';
                    bankGroup.style.display = 'block';
                }

                if (data.banner_url) {
                    const img = document.getElementById('currentImage');
                    img.src = data.banner_url;
                    img.style.display = 'block';
                }

                loadingState.style.display = 'none';
                editWrapper.style.display = 'block';

            } catch (err) {
                console.error('Error loading event:', err);
                loadingState.style.display = 'none';
                notFoundState.style.display = 'block';
            }
        }

        editForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            messageEl.className = 'message';

            try {
                let bannerUrl = currentEvent.banner_url;

                if (selectedFile) {
                    const fileExt = selectedFile.name.split('.').pop();
                    const filePath = `event-${currentEvent.id}-${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await sb.storage
                        .from('event-posters')
                        .upload(filePath, selectedFile, { cacheControl: '3600', upsert: false });

                    if (uploadError) throw new Error('Image upload failed: ' + uploadError.message);

                    const { data: urlData } = sb.storage.from('event-posters').getPublicUrl(filePath);
                    bannerUrl = urlData.publicUrl;
                }

                const updateData = {
                    title: document.getElementById('title').value.trim(),
                    description: document.getElementById('description').value.trim() || null,
                    venue: document.getElementById('venue').value.trim(),
                    event_date: document.getElementById('eventDate').value,
                    category: document.getElementById('category').value,
                    is_free: isFree,
                    price: isFree ? 0 : (parseFloat(document.getElementById('price').value) || 0),
                    bank_name: isFree ? null : document.getElementById('bankName').value.trim(),
                    account_name: isFree ? null : document.getElementById('accountName').value.trim(),
                    account_number: isFree ? null : document.getElementById('accountNumber').value.trim(),
                    banner_url: bannerUrl,
                };

                const { error: updateError } = await sb
                    .from('events')
                    .update(updateData)
                    .eq('edit_token', token);

                if (updateError) throw updateError;

                messageEl.textContent = 'Saved. Your changes are live.';
                messageEl.className = 'message success';
                selectedFile = null;
                document.getElementById('fileNameDisplay').textContent = '';

            } catch (err) {
                console.error('Error saving event:', err);
                messageEl.textContent = 'Could not save: ' + err.message;
                messageEl.className = 'message error';
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        });

        loadEvent();
    </script>
</body>
</html>
