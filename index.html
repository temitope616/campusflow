<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>EventFlow | Student Events</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Motion: smooth scroll + scroll-triggered animation -->
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <style>
        /* ============================================
                   RESET & BASE - PARTY VIBE EDITION
                   ============================================ */
        :root {
            --bg: #0a0a0a;
            --bg-glow-1: rgba(34, 197, 94, 0.12);
            --bg-glow-2: rgba(255, 255, 255, 0.04);
            --text: #f5f5f5;
            --text-muted: #9ca3af;
            --text-dim: #d9f7e3;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(34, 197, 94, 0.4);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --header-tag-bg: rgba(255, 255, 255, 0.06);
            --decor-display: block;
        }

        [data-theme="light"] {
            --bg: #f7f8f6;
            --bg-glow-1: rgba(34, 197, 94, 0.06);
            --bg-glow-2: rgba(0, 0, 0, 0.02);
            --text: #16181c;
            --text-muted: #5b6169;
            --text-dim: #14532d;
            --card-bg: #ffffff;
            --card-border: #e3e6e2;
            --card-hover-border: #16a34a;
            --input-bg: #ffffff;
            --input-border: #d7dbd6;
            --header-tag-bg: #eef2ec;
            --decor-display: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 16px;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 15% 0%, var(--bg-glow-1) 0%, transparent 45%),
                radial-gradient(ellipse at 100% 100%, var(--bg-glow-2) 0%, transparent 40%);
            color: var(--text);
            position: relative;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Animated floating particles for party vibe */
        .party-particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .party-particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0.4;
        }

        .party-particle:nth-child(1) {
            width: 8px;
            height: 8px;
            background: #86efac;
            left: 10%;
            animation-duration: 12s;
            animation-delay: 0s;
        }
        .party-particle:nth-child(2) {
            width: 12px;
            height: 12px;
            background: #ffffff;
            left: 25%;
            animation-duration: 15s;
            animation-delay: 2s;
            opacity: 0.3;
        }
        .party-particle:nth-child(3) {
            width: 6px;
            height: 6px;
            background: #ffffff;
            left: 40%;
            animation-duration: 10s;
            animation-delay: 4s;
        }
        .party-particle:nth-child(4) {
            width: 10px;
            height: 10px;
            background: #34d399;
            left: 55%;
            animation-duration: 18s;
            animation-delay: 1s;
            opacity: 0.3;
        }
        .party-particle:nth-child(5) {
            width: 14px;
            height: 14px;
            background: #22c55e;
            left: 70%;
            animation-duration: 14s;
            animation-delay: 3s;
            opacity: 0.2;
        }
        .party-particle:nth-child(6) {
            width: 8px;
            height: 8px;
            background: #4ade80;
            left: 85%;
            animation-duration: 16s;
            animation-delay: 5s;
        }
        .party-particle:nth-child(7) {
            width: 16px;
            height: 16px;
            background: #86efac;
            left: 50%;
            animation-duration: 20s;
            animation-delay: 7s;
            opacity: 0.15;
        }
        .party-particle:nth-child(8) {
            width: 6px;
            height: 6px;
            background: #ffffff;
            left: 15%;
            animation-duration: 11s;
            animation-delay: 6s;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        /* Glowing orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: pulseOrb 5s ease-in-out infinite alternate;
        }

        .glow-orb.purple {
            width: 480px;
            height: 480px;
            background: rgba(34, 197, 94, 0.1);
            top: -150px;
            right: -150px;
        }

        .glow-orb.pink {
            display: none;
        }

        .glow-orb.gold {
            width: 380px;
            height: 380px;
            background: rgba(255, 255, 255, 0.04);
            bottom: -120px;
            left: -120px;
            animation-delay: 3s;
        }

        @keyframes pulseOrb {
            0% {
                opacity: 0.35;
                filter: blur(100px);
            }
            100% {
                opacity: 0.75;
                filter: blur(130px);
            }
        }

        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 3;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
        }

        /* ============================================
                   HEADER - PARTY VIBE
                   ============================================ */
        .header {
            position: relative;
            z-index: 1;
            border-radius: 24px;
            margin-bottom: 24px;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            background: var(--card-bg);
        }

        .header-content {
            position: relative;
            z-index: 2;
            padding: 40px 30px;
            width: 100%;
        }

        .header h1 {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
        }

        .header h1 span {
            color: #22c55e;
            text-shadow: 0 0 40px rgba(22, 163, 74, 0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
            margin-top: 6px;
            color: var(--text-dim);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
        }

        .header .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .header .badge {
            display: inline-block;
            padding: 6px 18px;
            background: var(--header-tag-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-dim);
            border: 1px solid var(--card-border);
            animation: pulseBadge 3s ease-in-out infinite;
        }

        .header .badge.hot {
            background: rgba(74, 222, 128, 0.18);
            border-color: rgba(134, 239, 172, 0.2);
            color: #ffffff;
            animation-delay: 0.5s;
        }

        .header .badge.party {
            background: rgba(52, 211, 153, 0.15);
            border-color: rgba(52, 211, 153, 0.2);
            color: #ffffff;
            animation-delay: 1s;
        }

        @keyframes pulseBadge {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* ============================================
                   SEARCH & FILTERS
                   ============================================ */
        .search-section {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            color: #ffffff;
            transition: all 0.3s;
        }

        .search-bar input::placeholder {
            color: #9ca3af;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #86efac;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.1);
        }

        .category-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .view-btn {
            padding: 10px 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            color: #9cd8b3;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .view-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .view-btn.active {
            background: #16a34a;
            border-color: transparent;
            color: #ffffff;
        }

        #eventsContainer {
            transition: opacity 0.25s ease;
        }

        #eventsContainer.switching {
            opacity: 0;
        }

        .category-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #9cd8b3;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .category-btn:hover {
            border-color: #86efac;
            color: #ffffff;
        }

        .category-btn.active {
            background: #22c55e;
            color: #0a0a0a;
            border-color: transparent;
        }

        /* ============================================
                   SECTION TITLES
                   ============================================ */
        .section-title {
            position: relative;
            z-index: 1;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            margin: 28px 0 16px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .section-title .emoji {
            font-size: 30px;
            animation: bounceEmoji 2s ease-in-out infinite;
        }

        @keyframes bounceEmoji {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .section-title .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #86efac, transparent);
        }

        .section-title .count-badge {
            font-size: 14px;
            font-weight: 600;
            color: #9ca3af;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section-title.past {
            opacity: 0.5;
        }

        /* ============================================
                   EVENTS GRID
                   ============================================ */
        .events-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .event-card:nth-child(1) {
            animation-delay: 0.05s;
        }
        .event-card:nth-child(2) {
            animation-delay: 0.1s;
        }
        .event-card:nth-child(3) {
            animation-delay: 0.15s;
        }
        .event-card:nth-child(4) {
            animation-delay: 0.2s;
        }
        .event-card:nth-child(5) {
            animation-delay: 0.25s;
        }
        .event-card:nth-child(6) {
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .event-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 60px rgba(22, 163, 74, 0.15);
            border-color: rgba(74, 222, 128, 0.25);
        }

        .event-card .flyer-wrap {
            position: relative;
            overflow: hidden;
            height: 200px;
        }

        .event-card .flyer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(135deg, #081810, #0d2818);
            transition: transform 0.6s ease;
        }

        .event-card:hover .flyer {
            transform: scale(1.08);
        }

        .event-card .flyer-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-card .flyer-overlay .status-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-card .flyer-overlay .status-tag.upcoming {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.15);
        }

        .event-card .flyer-overlay .status-tag.ongoing {
            background: rgba(134, 239, 172, 0.25);
            color: #ffffff;
            border: 1px solid rgba(134, 239, 172, 0.2);
            animation: pulseOngoing 1.5s ease-in-out infinite;
        }

        @keyframes pulseOngoing {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(134, 239, 172, 0.2);
            }
            50% {
                box-shadow: 0 0 30px 10px rgba(134, 239, 172, 0.08);
            }
        }

        .event-card .flyer-overlay .status-tag.past {
            background: rgba(107, 114, 128, 0.25);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.15);
        }

        .event-card .flyer-overlay .countdown {
            color: white;
            font-size: 14px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .event-card .info {
            padding: 20px 20px 22px;
        }

        .event-card .info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .event-card .info .organizer-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 14px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 12px;
            font-size: 12px;
            color: #86efac;
            margin-bottom: 8px;
        }

        .event-card .info .meta {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .event-card .info .meta .icon {
            font-size: 14px;
        }

        .event-card .info .meta strong {
            color: #d1d5db;
        }

        .event-card .info .venue-link {
            color: #a7f3d0;
            text-decoration: none;
            border-bottom: 1px dotted rgba(167, 243, 208, 0.5);
        }

        .event-card .info .venue-link:hover {
            color: #ecfdf5;
        }

        .event-card .info .venue-link .map-arrow {
            font-size: 11px;
        }

        .event-card .info .social-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .like-btn,
        .comment-toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #d1d5db;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .like-btn:hover,
        .comment-toggle-btn:hover {
            border-color: rgba(52, 211, 153, 0.4);
            background: rgba(52, 211, 153, 0.08);
        }

        .like-btn.liked {
            border-color: rgba(52, 211, 153, 0.5);
            background: rgba(52, 211, 153, 0.12);
        }

        .like-btn .heart {
            transition: transform 0.2s ease;
        }

        .like-btn.liked .heart {
            transform: scale(1.15);
        }

        .comments-panel {
            display: none;
            margin: 4px 0 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
        }

        .comments-panel.open {
            display: block;
        }

        .comments-list {
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .comment-item {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-item strong {
            color: #e8fbf0;
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
        }

        .comment-item p {
            color: #9ca3af;
            line-height: 1.4;
        }

        .comments-status {
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            padding: 10px 0;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-form input {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #f5f5f7;
            font-size: 13px;
        }

        .comment-form input::placeholder {
            color: #6b7280;
        }

        .comment-form button {
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .event-card .info .category-tag {
            display: inline-block;
            padding: 2px 12px;
            background: rgba(74, 222, 128, 0.15);
            border-radius: 12px;
            font-size: 11px;
            color: #86efac;
            margin-bottom: 6px;
        }

        .event-card .info .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0 14px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .event-card .info .price {
            font-size: 24px;
            font-weight: 800;
            color: #4ade80;
        }

        .event-card .info .price small {
            font-size: 13px;
            font-weight: 400;
            color: #9ca3af;
            -webkit-text-fill-color: #9ca3af;
        }

        .event-card .info .price.free-price {
            color: #86efac;
        }

        .event-card .info .fee-badge {
            font-size: 12px;
            color: #9ca3af;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .buy-btn {
            width: 100%;
            padding: 14px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease-out, background 0.2s ease;
            position: relative;
        }

        .buy-btn:hover:not(:disabled) {
            background: #15803d;
        }

        .buy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(22, 163, 74, 0.4);
        }

        .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            animation: none;
        }

        .buy-btn:disabled::after {
            display: none;
        }

        .buy-btn.past-event {
            background: rgba(107, 114, 128, 0.2);
            animation: none;
            cursor: not-allowed;
            color: #9ca3af;
        }

        .buy-btn.past-event:hover {
            transform: none;
            box-shadow: none;
        }

        .buy-btn.past-event::after {
            display: none;
        }

        /* ============================================
                   LOADING & EMPTY STATES
                   ============================================ */
        .loading-state {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 80px 20px;
            color: #9cd8b3;
        }

        .loading-state .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(74, 222, 128, 0.15);
            border-top-color: #86efac;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

<body>

    <!-- ==========================================

    <!-- ==========================================
    SEARCH & FILTERS
    ========================================== -->
    <div class="search-section">

            <input type="text" id="searchInput" placeholder="Search events by title, venue, or organizer..." />
        </div>

            <button class="category-btn" data-category="sports">Sports</button>

    <!-- ==========================================
    EVENTS CONTAINER
    ========================================== -->
    <div id="eventsContainer">
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>Loading events...</p>
        </div>
    </div>

    <!-- ==========================================
    JAVASCRIPT - COMPLETE WORKING VERSION
    ========================================== -->
    <script>
        // ============================================
        // SUPABASE CONFIG - YOUR CREDENTIALS
        // ============================================
        const SUPABASE_URL = "https://yfwxwqvksdsugxizaksj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_vvacDvbRi-H7XcBesuCmmw_rcTe6gwO";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('EventFlow loaded!');

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const eventsContainer = document.getElementById('eventsContainer');
        const loadingState = document.getElementById('loadingState');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.category-btn');

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ============================================
        // DARK / LIGHT MODE
        // ============================================
        function initThemeToggle() {
            const toggleBtn = document.getElementById('themeToggle');
            const saved = localStorage.getItem('cf_theme') || 'dark';

            function applyTheme(theme) {
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    toggleBtn.textContent = '☀️';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    toggleBtn.textContent = '🌙';
                }
            }

            applyTheme(saved);

            toggleBtn.addEventListener('click', function() {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                const next = isLight ? 'dark' : 'light';
                applyTheme(next);
                localStorage.setItem('cf_theme', next);
            });
        }
        const motionReady = !prefersReducedMotion && typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined';
        if (motionReady) {
            gsap.registerPlugin(ScrollTrigger);
        }

        let allEvents = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let currentView = 'upcoming';
        const ITEMS_PER_BATCH = 4;
        let itemsShown = ITEMS_PER_BATCH;
        let currentFilteredList = [];
        let scrollObserver = null;
        const loadedComments = {};

        // ============================================
        // LOAD EVENTS (ONLY APPROVED)
        // ============================================
        async function loadEvents() {
            try {
                console.log('📡 Fetching approved events...');

                const { data: events, error } = await sb
                    .from('events')
                    .select('*')
                    .eq('is_published', true)
                    .order('event_date', { ascending: true });

                if (error) {
                    console.error('❌ Supabase Error:', error);
                    throw error;
                }

                console.log('✅ Events fetched:', events ? events.length : 0);

                // Hide loading
                loadingState.style.display = 'none';

                if (!events || events.length === 0) {
                    eventsContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🎪</div>
                            <h3>No Events Yet!</h3>
                            <p>Be the first to create an event on EventFlow.</p>
                        </div>
                    `;
                    return;
                }

                allEvents = events;
                renderEvents(events);

            } catch (error) {
                console.error('❌ Error loading events:', error);
                loadingState.style.display = 'none';
                eventsContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>Error Loading Events</h3>
                        <p>${error.message}</p>
                        <p style="font-size:12px;color:#6b7280;margin-top:8px;">
                            Check console for details (F12 → Console)
                        </p>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER EVENTS
        // ============================================
        function renderEvents(events) {
            const now = new Date();

            // Filter by category
            let filtered = events;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(e => e.category === currentCategory);
            }

            // Filter by search
            if (searchQuery.trim()) {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(e =>
                    e.title.toLowerCase().includes(query) ||
                    e.venue.toLowerCase().includes(query) ||
                    e.organizer_name.toLowerCase().includes(query)
                );
            }

            // Split into upcoming and past
            const upcoming = filtered.filter(e => new Date(e.event_date) >= now);
            const past = filtered.filter(e => new Date(e.event_date) < now);

            currentFilteredList = currentView === 'upcoming' ? upcoming : past;
            itemsShown = ITEMS_PER_BATCH;

            let headingHtml = '';

            if (currentView === 'upcoming') {
                headingHtml = upcoming.length > 0
                    ? `<div class="section-title">
                           Upcoming Events
                           <span class="line"></span>
                           <span class="count-badge">${upcoming.length}</span>
                       </div>`
                    : '';
            } else {
                headingHtml = past.length > 0
                    ? `<div class="section-title past">
                           Past Events
                           <span class="line"></span>
                           <span class="count-badge">${past.length}</span>
                       </div>`
                    : '';
            }

            if (filtered.length === 0) {
                eventsContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>No Results Found</h3>
                        <p>Try adjusting your search or filters.</p>
                    </div>
                `;
                return;
            }

            if (currentFilteredList.length === 0) {
                eventsContainer.innerHTML = currentView === 'upcoming'
                    ? `<div class="empty-state">
                           <h3>No Upcoming Events Yet</h3>
                           <p>Check back soon, or browse past events.</p>
                       </div>`
                    : `<div class="empty-state">
                           <h3>No Past Events</h3>
                           <p>Nothing here yet.</p>
                       </div>`;
                return;
            }

            eventsContainer.innerHTML = headingHtml +
                `<div class="events-grid" id="eventsGrid"></div>` +
                `<div id="scrollSentinel" style="height:1px;"></div>`;

            appendEventCards(currentFilteredList.slice(0, itemsShown));
            setupInfiniteScroll();
        }

        // ============================================
        // APPEND A BATCH OF CARDS (used for both initial
        // render and infinite scroll "load more")
        // ============================================
        async function appendEventCards(events) {
            const grid = document.getElementById('eventsGrid');
            if (!grid || events.length === 0) return;

            const ids = events.map(e => e.id);
            const socialData = {};
            ids.forEach(id => { socialData[id] = { likeCount: 0, likedByMe: false, commentCount: 0 }; });

            try {
                const deviceId = getDeviceId();
                const [likesRes, commentsRes] = await Promise.all([
                    sb.from('event_likes').select('event_id, device_id').in('event_id', ids),
                    sb.from('event_comments').select('event_id').in('event_id', ids)
                ]);

                (likesRes.data || []).forEach(function(row) {
                    socialData[row.event_id].likeCount++;
                    if (row.device_id === deviceId) socialData[row.event_id].likedByMe = true;
                });

                (commentsRes.data || []).forEach(function(row) {
                    socialData[row.event_id].commentCount++;
                });
            } catch (err) {
                console.log('Could not load likes/comments (tables may not exist yet):', err.message);
            }

            grid.insertAdjacentHTML('beforeend', events.map(function(event) {
                return createEventCard(event, currentView, socialData[event.id]);
            }).join(''));

            animateEventCards();
        }

        // ============================================
        // INFINITE SCROLL
        // ============================================
        function setupInfiniteScroll() {
            if (scrollObserver) scrollObserver.disconnect();

            const sentinel = document.getElementById('scrollSentinel');
            if (!sentinel) return;

            scrollObserver = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting && itemsShown < currentFilteredList.length) {
                        const next = currentFilteredList.slice(itemsShown, itemsShown + ITEMS_PER_BATCH);
                        itemsShown += ITEMS_PER_BATCH;
                        appendEventCards(next);
                    }
                });
            }, { rootMargin: '400px' });

            scrollObserver.observe(sentinel);
        }

        // ============================================
        // CREATE EVENT CARD
        // ============================================
        function createEventCard(event, status, social) {
            social = social || { likeCount: 0, likedByMe: false, commentCount: 0 };
            const eventDate = new Date(event.event_date);
            const now = new Date();
            const isPast = status === 'past';

            let statusClass = 'past';
            let statusText = 'Past';

            if (!isPast) {
                const diffMs = eventDate - now;
                const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                const diffHours = Math.ceil(diffMs / (1000 * 60 * 60));

                if (diffDays <= 1 && diffDays >= 0) {
                    statusClass = 'ongoing';
                    statusText = diffHours <= 24 ? `${diffHours}h left` : 'Tomorrow';
                } else if (diffDays <= 3) {
                    statusClass = 'ongoing';
                    statusText = `In ${diffDays} days`;
                } else {
                    statusClass = 'upcoming';
                    statusText = `In ${diffDays} days`;
                }
            }

            let countdownText = '';
            if (!isPast) {
                const diffMs = eventDate - now;
                const diffHours = Math.ceil(diffMs / (1000 * 60 * 60));
                if (diffHours <= 48 && diffHours > 0) {
                    const h = Math.floor(diffMs / (1000 * 60 * 60));
                    const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    countdownText = `${h}h ${m}m`;
                } else if (diffHours > 0) {
                    const d = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    countdownText = `${d}d`;
                }
            }

            const buttonDisabled = isPast ? 'disabled' : '';
            const buttonClass = isPast ? 'buy-btn past-event' : 'buy-btn';
            let buttonText = isPast ? 'Event Passed' : 'Buy Ticket';
            if (!isPast && event.is_free) {
                buttonText = 'RSVP Free';
            }

            const priceRowHtml = event.is_free
                ? `<div class="price-row">
                       <span class="price free-price">FREE</span>
                       <span class="fee-badge">No ticket needed</span>
                   </div>`
                : `<div class="price-row">
                       <span class="price">₦${event.price} <small>(+ ₦100 fee)</small></span>
                       <span class="fee-badge">incl. fee</span>
                   </div>`;

            return `
                <div class="event-card">
                    <div class="flyer-wrap">
                        <img src="${event.banner_url || ''}" class="flyer" alt="${event.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22%3E%3Crect width=%22400%22 height=%22200%22 fill=%22%230d2818%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%234ade80%22 font-size=%2220%22%3EEvent%3C/text%3E%3C/svg%3E'" />
                        <div class="flyer-overlay">
                            <span class="status-tag ${statusClass}">${statusText}</span>
                            ${countdownText ? `<span class="countdown">${countdownText}</span>` : ''}
                        </div>
                    </div>
                    <div class="info">
                        <h3>${event.title}</h3>
                        <div class="organizer-tag">${event.organizer_name}</div>
                        <div class="category-tag">${event.category || 'General'}</div>
                        <div class="meta">
                            <strong>Venue:</strong>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.venue)}"
                               target="_blank" rel="noopener" class="venue-link" onclick="event.stopPropagation()">
                                ${event.venue} <span class="map-arrow">↗</span>
                            </a>
                        </div>
                        <div class="meta"><span class="icon">📅</span> <strong>Date:</strong> ${eventDate.toLocaleString()}</div>
                        ${priceRowHtml}

                        <div class="social-row">
                            <button class="like-btn ${social.likedByMe ? 'liked' : ''}" onclick="toggleLike('${event.id}', this)">
                                <span class="heart">${social.likedByMe ? '❤️' : '🤍'}</span>
                                <span class="like-count">${social.likeCount}</span>
                            </button>
                            <button class="comment-toggle-btn" onclick="toggleComments('${event.id}', this)">
                                💬 <span class="comment-count" id="commentCount-${event.id}">${social.commentCount}</span>
                            </button>
                        </div>

                        <div class="comments-panel" id="commentsPanel-${event.id}">
                            <div class="comments-list" id="commentsList-${event.id}"></div>
                            <form class="comment-form" onsubmit="return submitComment(event, '${event.id}')">
                                <input type="text" placeholder="Name" class="comment-name-input" maxlength="40" required />
                                <input type="text" placeholder="Say something..." class="comment-text-input" maxlength="200" required />
                                <button type="submit">Post</button>
                            </form>
                        </div>

                        <button class="${buttonClass}" onclick="openModal('${event.id}')" ${buttonDisabled}>
                            ${buttonText}
                        </button>
                    </div>
                </div>
            `;
        }

        // ============================================
        // OPEN MODAL - REDIRECT TO PAYMENT OR RSVP PAGE
        // ============================================
        async function openModal(eventId) {
            try {
                console.log('🎫 Opening event:', eventId);

                const { data: event, error } = await sb
                    .from('events')
                    .select('*')
                    .eq('id', eventId)
                    .single();

                if (error) {
                    console.error('❌ Error fetching event:', error);
                    throw error;
                }

                if (new Date(event.event_date) < new Date()) {
                    alert('📅 This event has already passed. Check out our upcoming events!');
                    return;
                }

                if (event.is_free) {
                    console.log('✅ Redirecting to RSVP page (free event)');
                    window.location.href = `rsvp.html?eventId=${event.id}`;
                } else {
                    console.log('✅ Redirecting to payment page');
                    window.location.href = `payment.html?eventId=${event.id}`;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                alert('Error loading event details: ' + error.message);
            }
        }

        // ============================================
        // SEARCH & FILTERS
        // ============================================
        searchInput.addEventListener('input', function() {
            searchQuery = this.value;
            renderEvents(allEvents);
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                categoryBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderEvents(allEvents);
            });
        });

        // ============================================
        // UPCOMING / PAST VIEW TOGGLE
        // ============================================
        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.dataset.view === currentView) return;

                viewBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;

                eventsContainer.classList.add('switching');
                setTimeout(function() {
                    renderEvents(allEvents);
                    eventsContainer.classList.remove('switching');
                }, 200);
            });
        });

        // ============================================
        // CINEMATIC MOTION - HERO INTRO
        // ============================================
        function initHeroIntro() {
            if (!motionReady) return;

            gsap.set(['.header h1', '.header p', '.header .badge', '.search-section'], { opacity: 1 });

            const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
            tl.from('.header h1', { opacity: 0, y: 40, scale: 0.92, filter: 'blur(16px)', duration: 1.1 })
              .from('.header p', { opacity: 0, y: 20, duration: 0.7 }, '-=0.6')
              .from('.header .badge', { opacity: 0, y: 16, scale: 0.85, duration: 0.5, stagger: 0.12 }, '-=0.4')
              .from('.search-section', { opacity: 0, y: 24, duration: 0.7 }, '-=0.3')
              .set(['.header h1', '.header p', '.header .badge', '.search-section'], { clearProps: 'all' });
        }

        // ============================================
        // CINEMATIC MOTION - MOUSE PARALLAX ON ORBS
        // ============================================
        function initOrbParallax() {
            if (prefersReducedMotion) return;
            const orbs = document.querySelectorAll('.glow-orb');
            if (!orbs.length) return;

            window.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                orbs.forEach(function(orb, i) {
                    const depth = (i + 1) * 16;
                    const centered = orb.classList.contains('gold') ? 'translate(-50%, -50%) ' : '';
                    orb.style.transform = `${centered}translate(${x * depth}px, ${y * depth}px)`;
                });
            }, { passive: true });
        }

        // ============================================
        // CINEMATIC MOTION - MAGNETIC BUTTONS
        // ============================================
        function initMagneticButtons() {
            if (prefersReducedMotion) return;

            eventsContainer.addEventListener('mousemove', function(e) {
                const btn = e.target.closest('.buy-btn:not(.past-event):not(:disabled)');
                if (!btn) return;
                const rect = btn.getBoundingClientRect();
                const relX = e.clientX - rect.left - rect.width / 2;
                const relY = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate(${relX * 0.2}px, ${relY * 0.35}px)`;
            });

            eventsContainer.addEventListener('mouseout', function(e) {
                const btn = e.target.closest('.buy-btn');
                if (btn) btn.style.transform = '';
            });
        }

        // ============================================
        // SMOOTH SCROLL (LENIS)
        // ============================================
        function initSmoothScroll() {
            if (prefersReducedMotion || typeof Lenis === 'undefined') return;

            const lenis = new Lenis({ duration: 1.1, smoothWheel: true });

            if (motionReady) {
                lenis.on('scroll', ScrollTrigger.update);
                gsap.ticker.add(function(time) { lenis.raf(time * 1000); });
                gsap.ticker.lagSmoothing(0);
            } else {
                (function raf(time) {
                    lenis.raf(time);
                    requestAnimationFrame(raf);
                })();
            }
        }

        // ============================================
        // CINEMATIC EVENT CARD SCROLL-REVEAL
        // ============================================
        function animateEventCards() {
            const cards = document.querySelectorAll('.event-card:not([data-revealed])');
            if (!cards.length) return;

            cards.forEach(function(card) { card.setAttribute('data-revealed', '1'); });

            if (!motionReady) {
                // Existing CSS fadeInUp keyframe (already in place) handles this
                // fallback nicely when the motion library isn't available.
                return;
            }

            cards.forEach(function(card, i) {
                // Stop the CSS keyframe fallback from fighting with GSAP's own values.
                card.style.animation = 'none';

                gsap.fromTo(card,
                    { opacity: 0, y: 70, scale: 0.9, filter: 'blur(12px)' },
                    {
                        opacity: 1,
                        y: 0,
                        scale: 1,
                        filter: 'blur(0px)',
                        duration: 0.9,
                        delay: (i % 3) * 0.08,
                        ease: 'power3.out',
                        scrollTrigger: {
                            trigger: card,
                            start: 'top 90%',
                            once: true
                        },
                        onComplete: function() {
                            gsap.set(card, { clearProps: 'all' });
                        }
                    }
                );
            });
        }

        // ============================================
        // LIKES
        // ============================================
        async function toggleLike(eventId, btnEl) {
            const deviceId = getDeviceId();
            const heartSpan = btnEl.querySelector('.heart');
            const countSpan = btnEl.querySelector('.like-count');
            const wasLiked = btnEl.classList.contains('liked');
            const prevCount = parseInt(countSpan.textContent, 10) || 0;

            // Optimistic UI update
            btnEl.classList.toggle('liked');
            heartSpan.textContent = wasLiked ? '🤍' : '❤️';
            countSpan.textContent = wasLiked ? Math.max(0, prevCount - 1) : prevCount + 1;

            try {
                if (wasLiked) {
                    const { error } = await sb.from('event_likes')
                        .delete()
                        .eq('event_id', eventId)
                        .eq('device_id', deviceId);
                    if (error) throw error;
                } else {
                    const { error } = await sb.from('event_likes')
                        .insert([{ event_id: eventId, device_id: deviceId }]);
                    if (error) throw error;
                }
            } catch (err) {
                console.error('Like toggle failed, reverting:', err);
                btnEl.classList.toggle('liked');
                heartSpan.textContent = wasLiked ? '❤️' : '🤍';
                countSpan.textContent = prevCount;
            }
        }

        // ============================================
        // COMMENTS
        // ============================================
        async function toggleComments(eventId, btnEl) {
            const panel = document.getElementById('commentsPanel-' + eventId);
            if (!panel) return;

            const isOpen = panel.classList.contains('open');
            panel.classList.toggle('open', !isOpen);

            if (!isOpen && !loadedComments[eventId]) {
                await loadComments(eventId);
            }
        }

        async function loadComments(eventId) {
            const list = document.getElementById('commentsList-' + eventId);
            if (list) list.innerHTML = '<p class="comments-status">Loading comments…</p>';

            try {
                const { data, error } = await sb
                    .from('event_comments')
                    .select('*')
                    .eq('event_id', eventId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loadedComments[eventId] = data || [];
                renderCommentsList(eventId);
            } catch (err) {
                console.error('Error loading comments:', err);
                if (list) list.innerHTML = '<p class="comments-status">Could not load comments.</p>';
            }
        }

        function renderCommentsList(eventId) {
            const list = document.getElementById('commentsList-' + eventId);
            const countEl = document.getElementById('commentCount-' + eventId);
            const comments = loadedComments[eventId] || [];

            if (countEl) countEl.textContent = comments.length;
            if (!list) return;

            if (comments.length === 0) {
                list.innerHTML = '<p class="comments-status">No comments yet — be the first!</p>';
                return;
            }

            list.innerHTML = comments.map(function(c) {
                return `<div class="comment-item"><strong>${escapeHtml(c.name)}</strong><p>${escapeHtml(c.comment)}</p></div>`;
            }).join('');
        }

        async function submitComment(domEvent, eventId) {
            domEvent.preventDefault();
            const form = domEvent.target;
            const nameInput = form.querySelector('.comment-name-input');
            const textInput = form.querySelector('.comment-text-input');
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name || !text) return false;

            try {
                const { error } = await sb.from('event_comments').insert([{ event_id: eventId, name: name, comment: text }]);
                if (error) throw error;
                nameInput.value = '';
                textInput.value = '';
                await loadComments(eventId);
            } catch (err) {
                console.error('Error posting comment:', err);
                alert('Could not post your comment: ' + err.message);
            }
            return false;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================
        // ANIMATED PARTY ATMOSPHERE (canvas)
        // Floating light/bokeh particles ambient in the hero,
        // plus a one-time confetti burst on load.
        // ============================================
        function initPartyAtmosphere() {
            const canvas = document.getElementById('partyCanvas');
            if (!canvas) return;

            if (prefersReducedMotion) {
                canvas.style.display = 'none';
                return;
            }

            const ctx = canvas.getContext('2d');
            const header = canvas.closest('.header');
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            let w = 0,
                h = 0;

            function resize() {
                w = header.clientWidth;
                h = header.clientHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            const bokehColors = ['255,255,255', '134,239,172', '74,222,128', '34,197,94'];
            const bokeh = Array.from({ length: 26 }, function() {
                return {
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: 2 + Math.random() * 4,
                    speed: 0.15 + Math.random() * 0.35,
                    drift: (Math.random() - 0.5) * 0.3,
                    alpha: 0.15 + Math.random() * 0.35,
                    color: bokehColors[Math.floor(Math.random() * bokehColors.length)]
                };
            });

            const confettiColors = ['#4ade80', '#ffffff', '#16a34a', '#ffffff', '#86efac'];
            let confetti = Array.from({ length: 60 }, function() {
                return {
                    x: Math.random() * w,
                    y: -20 - Math.random() * h,
                    size: 4 + Math.random() * 5,
                    speedY: 1.5 + Math.random() * 2.5,
                    speedX: (Math.random() - 0.5) * 1.5,
                    rotation: Math.random() * 360,
                    spin: (Math.random() - 0.5) * 8,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    life: 1
                };
            });
            let confettiActive = true;
            setTimeout(function() { confettiActive = false; }, 2200);

            let hidden = false;
            document.addEventListener('visibilitychange', function() {
                hidden = document.hidden;
            });

            function frame() {
                requestAnimationFrame(frame);
                if (hidden) return;
                ctx.clearRect(0, 0, w, h);

                bokeh.forEach(function(p) {
                    p.y -= p.speed;
                    p.x += p.drift;
                    if (p.y < -10) { p.y = h + 10;
                        p.x = Math.random() * w; }
                    if (p.x < -10) p.x = w + 10;
                    if (p.x > w + 10) p.x = -10;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + p.color + ',' + p.alpha + ')';
                    ctx.fill();
                });

                if (confettiActive || confetti.some(function(c) { return c.life > 0.02; })) {
                    confetti.forEach(function(c) {
                        if (!confettiActive) c.life -= 0.02;
                        if (c.life <= 0) return;
                        c.y += c.speedY;
                        c.x += c.speedX;
                        c.rotation += c.spin;
                        if (c.y > h + 20 && confettiActive) {
                            c.y = -20;
                            c.x = Math.random() * w;
                        }
                        ctx.save();
                        ctx.globalAlpha = Math.max(c.life, 0);
                        ctx.translate(c.x, c.y);
                        ctx.rotate((c.rotation * Math.PI) / 180);
                        ctx.fillStyle = c.color;
                        ctx.fillRect(-c.size / 2, -c.size / 3, c.size, c.size * 0.6);
                        ctx.restore();
                    });
                }
            }
            frame();
        }

        // ============================================
        // SHARED DEVICE ID (used for visit tracking + likes)
        // ============================================
        // ============================================
        // CUSTOMER SERVICE WIDGET
        // ============================================
        const CS_ADMIN_PHONE = '2348146275644';
        const CS_FAQ = [
            { keywords: ['refund', 'money back', 'cancel'], answer: "Refunds are handled case-by-case. Message the event organizer through their event page, or contact admin below if it's urgent." },
            { keywords: ['ticket', 'buy', 'pay', 'payment'], answer: 'Tap an event, fill in your details, upload your payment receipt, then wait for admin to confirm — you\'ll see it update automatically on that same page.' },
            { keywords: ['free', 'rsvp'], answer: "Free events just need your name and email — no payment, no waiting for confirmation." },
            { keywords: ['qr', 'scan', 'entry', 'door'], answer: 'If your event has an "Online Ticket" QR code, it\'s shown right on your confirmation page once payment is confirmed. Show that at the door.' },
            { keywords: ['submit', 'organizer', 'host', 'create event'], answer: 'Use the "Submit Event" page. You\'ll get a private edit link afterward — save it, since it\'s the only way to update your event later.' },
            { keywords: ['edit', 'change', 'update event'], answer: "Use the private edit link you got when you submitted your event. If you lost it, contact admin below and they can look it up." },
            { keywords: ['pending', 'waiting', 'confirm'], answer: 'Pending means admin hasn\'t verified your payment receipt yet. This is usually quick — the page updates on its own once it\'s confirmed.' },
        ];

        function csFindAnswer(question) {
            const q = question.toLowerCase();
            for (const entry of CS_FAQ) {
                if (entry.keywords.some(k => q.includes(k))) {
                    return entry.answer;
                }
            }
            return null;
        }

        // 🔥 FIX: Added null-check so the error doesn't stop events from loading
        function initCustomerService() {
            const toggleBtn = document.getElementById('csToggle');
            const panel = document.getElementById('csPanel');
            const closeBtn = document.getElementById('csClose');
            const messagesEl = document.getElementById('csMessages');
            const form = document.getElementById('csForm');
            const input = document.getElementById('csInput');

            // Exit early if any element is missing, so the rest of the page works
            if (!toggleBtn || !panel || !closeBtn || !messagesEl || !form || !input) {
                console.warn('💬 Customer service elements missing – skipping.');
                return;
            }

            function addMessage(text, from) {
                const div = document.createElement('div');
                div.className = 'cs-message ' + from;
                div.textContent = text;
                messagesEl.appendChild(div);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            toggleBtn.addEventListener('click', function() {
                panel.classList.toggle('open');
            });
            closeBtn.addEventListener('click', function() {
                panel.classList.remove('open');
            });

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const question = input.value.trim();
                if (!question) return;

                addMessage(question, 'user');
                input.value = '';

                const answer = csFindAnswer(question);
                setTimeout(function() {
                    if (answer) {
                        addMessage(answer, 'bot');
                    } else {
                        addMessage("I'm not sure about that one. Tap below to ask the admin directly on WhatsApp.", 'bot');
                        const waLink = document.createElement('a');
                        waLink.href = `https://wa.me/${CS_ADMIN_PHONE}?text=${encodeURIComponent('Hi, I have a question about EventFlow: ' + question)}`;
                        waLink.target = '_blank';
                        waLink.className = 'cs-whatsapp-link';
                        waLink.textContent = 'Ask Admin on WhatsApp';
                        messagesEl.appendChild(waLink);
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                }, 400);
            });
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('cf_device_id');
            if (!deviceId) {
                deviceId = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2);
                localStorage.setItem('cf_device_id', deviceId);
            }
            return deviceId;
        }

        // ============================================
        // SITE VISIT TRACKING
        // "Viewers" = every page load logged (counted every time)
        // "Users"   = distinct device IDs (counted once per device, ever)
        // ============================================
        function initVisitTracking() {
            try {
                const deviceId = getDeviceId();

                sb.from('site_visits')
                    .insert([{ device_id: deviceId, page: 'index' }])
                    .then(function(res) {
                        if (res.error) {
                            console.log('Visit log skipped:', res.error.message);
                        }
                    });
            } catch (err) {
                console.log('Visit tracking unavailable:', err);
            }
        }

        // ============================================
        // START
        // ============================================
        initThemeToggle();
        initCustomerService();
        initSmoothScroll();
        initHeroIntro();
        initOrbParallax();
        initMagneticButtons();
        initPartyAtmosphere();
        initVisitTracking();

        loadEvents();

        // Auto-refresh every 60 seconds
        setInterval(loadEvents, 60000);

        console.log('EventFlow Live!');
        console.log('📌 Features:');
        console.log('  ✅ Party Vibe Background with Animation');
        console.log('  ✅ Header with Event Image');
        console.log('  ✅ Displays approved events');
        console.log('  ✅ Category filters');
        console.log('  ✅ Search events');
        console.log('  ✅ Buy Ticket → Redirects to payment.html');
        console.log('  ✅ Mobile responsive');
        console.log('  ✅ Cinematic scroll motion:', motionReady ? 'ON (GSAP + Lenis)' : 'reduced/fallback');
    </script>

    <!-- ==========================================
    CUSTOMER SERVICE WIDGET
    ========================================== -->
    <button id="csToggle" class="cs-toggle" aria-label="Customer service">?</button>
    <div id="csPanel" class="cs-panel">
        <div class="cs-header">
            <span>Need Help?</span>
            <button id="csClose" class="cs-close">×</button>
        </div>
        <div id="csMessages" class="cs-messages">
            <div class="cs-message bot">Hi! Ask me anything about buying tickets, submitting events, or QR check-in. If I can't help, I'll point you to admin on WhatsApp.</div>
        </div>
        <form id="csForm" class="cs-form">
            <input type="text" id="csInput" placeholder="Type your question..." />
            <button type="submit">Send</button>
        </form>
    </div>

</body>
