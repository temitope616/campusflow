<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>EventFlow | Student Events</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ============================================
                   RESET & BASE – PARTY VIBE
                   ============================================ */
        :root {
            --bg: #0a0a0a;
            --text: #f5f5f5;
            --text-muted: #b0b8c0;
            --text-dim: #d9f7e3;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.12);
            --header-tag-bg: rgba(255, 255, 255, 0.06);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow-color: rgba(74, 222, 128, 0.15);
        }

        [data-theme="light"] {
            --bg: #f0f2ee;
            --text: #16181c;
            --text-muted: #4b4f55;
            --text-dim: #14532d;
            --card-bg: #ffffff;
            --card-border: #d7dbd6;
            --input-bg: #ffffff;
            --input-border: #d7dbd6;
            --header-tag-bg: #eef2ec;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --glow-color: rgba(22, 163, 74, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================
                   ANIMATED BACKGROUND – PARTY VIBE
                   ============================================ */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-canvas .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .bg-canvas .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: rgba(34, 197, 94, 0.15);
            top: -150px;
            left: -100px;
            animation-duration: 14s;
        }

        .bg-canvas .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: rgba(74, 222, 128, 0.10);
            bottom: -100px;
            right: -100px;
            animation-duration: 18s;
            animation-delay: 3s;
        }

        .bg-canvas .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: rgba(167, 139, 250, 0.08);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-duration: 20s;
            animation-delay: 5s;
        }

        .bg-canvas .orb:nth-child(4) {
            width: 300px;
            height: 300px;
            background: rgba(251, 191, 36, 0.06);
            top: 10%;
            right: 10%;
            animation-duration: 16s;
            animation-delay: 2s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.9);
            }
            100% {
                transform: translate(40px, 20px) scale(1.05);
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(74, 222, 128, 0.3);
            animation: particleFloat linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            animation-duration: 18s;
            animation-delay: 0s;
            width: 6px;
            height: 6px;
        }
        .particle:nth-child(2) {
            left: 25%;
            animation-duration: 22s;
            animation-delay: 2s;
            background: rgba(167, 139, 250, 0.25);
        }
        .particle:nth-child(3) {
            left: 40%;
            animation-duration: 16s;
            animation-delay: 4s;
            width: 8px;
            height: 8px;
        }
        .particle:nth-child(4) {
            left: 55%;
            animation-duration: 24s;
            animation-delay: 1s;
            background: rgba(251, 191, 36, 0.2);
        }
        .particle:nth-child(5) {
            left: 70%;
            animation-duration: 20s;
            animation-delay: 3s;
        }
        .particle:nth-child(6) {
            left: 85%;
            animation-duration: 26s;
            animation-delay: 5s;
            background: rgba(167, 139, 250, 0.2);
        }
        .particle:nth-child(7) {
            left: 15%;
            animation-duration: 30s;
            animation-delay: 7s;
            width: 3px;
            height: 3px;
        }
        .particle:nth-child(8) {
            left: 50%;
            animation-duration: 28s;
            animation-delay: 6s;
            width: 7px;
            height: 7px;
            background: rgba(74, 222, 128, 0.25);
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ============================================
                   HEADER
                   ============================================ */
        .header {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
        }
        .header h1 span {
            color: #22c55e;
            text-shadow: 0 0 40px rgba(22, 163, 74, 0.2);
        }
        .header p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 16px;
        }
        .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .badge {
            display: inline-block;
            padding: 6px 18px;
            background: var(--header-tag-bg);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }
        .badge.hot {
            background: rgba(74, 222, 128, 0.18);
            border-color: rgba(134, 239, 172, 0.2);
            color: var(--text);
        }
        .badge.party {
            background: rgba(167, 139, 250, 0.12);
            border-color: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
        }

        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 3;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.08);
        }

        /* ============================================
                   SEARCH & FILTERS
                   ============================================ */
        .search-section {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }
        .search-bar input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            transition: border 0.3s;
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        .search-bar input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.06);
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            margin: 14px 0 12px;
        }
        .view-btn {
            padding: 10px 22px;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            background: var(--card-bg);
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .view-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }
        .view-btn.active {
            background: #16a34a;
            color: #fff;
            border-color: transparent;
        }

        .category-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .category-btn {
            padding: 8px 18px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-btn:hover {
            border-color: #86efac;
            color: var(--text);
        }
        .category-btn.active {
            background: #22c55e;
            color: #0a0a0a;
            border-color: transparent;
        }

        /* ============================================
                   SECTION TITLE
                   ============================================ */
        .section-title {
            position: relative;
            z-index: 1;
            font-size: 24px;
            font-weight: 800;
            margin: 28px 0 16px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text);
        }
        .section-title .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #86efac, transparent);
        }
        .section-title .count-badge {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        /* ============================================
                   EVENTS GRID – 2×2 COLLAGE
                   ============================================ */
        .events-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            max-width: 800px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }
        .event-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(74, 222, 128, 0.25);
            box-shadow: 0 12px 40px rgba(22, 163, 74, 0.08);
        }

        .event-card .flyer-wrap {
            aspect-ratio: 1/1;
            overflow: hidden;
            position: relative;
        }
        .event-card .flyer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .event-card:hover .flyer {
            transform: scale(1.05);
        }

        .event-card .flyer-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-card .flyer-overlay .status-tag {
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.15);
        }
        .event-card .flyer-overlay .status-tag.ongoing {
            background: rgba(134, 239, 172, 0.25);
            color: #fff;
            border-color: rgba(134, 239, 172, 0.2);
            animation: pulseOngoing 1.5s infinite;
        }
        @keyframes pulseOngoing {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(134, 239, 172, 0.2);
            }
            50% {
                box-shadow: 0 0 20px 6px rgba(134, 239, 172, 0.08);
            }
        }
        .event-card .flyer-overlay .status-tag.past {
            background: rgba(107, 114, 128, 0.25);
            color: #9ca3af;
            border-color: rgba(107, 114, 128, 0.15);
        }
        .event-card .flyer-overlay .countdown {
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 12px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
        }

        .event-card .info {
            padding: 12px 14px 14px;
        }
        .event-card .info .category-tag {
            display: inline-block;
            padding: 1px 10px;
            background: rgba(74, 222, 128, 0.12);
            border-radius: 10px;
            font-size: 9px;
            color: #86efac;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .event-card .info h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .event-card .info .organizer-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            background: rgba(74, 222, 128, 0.06);
            border-radius: 10px;
            font-size: 10px;
            color: #86efac;
            margin-bottom: 4px;
        }
        .event-card .info .meta {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 2px 0;
        }
        .event-card .info .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0 8px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }
        .event-card .info .price {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }
        .event-card .info .price.free-price {
            color: #86efac;
        }
        .event-card .info .fee-badge {
            font-size: 9px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* ============================================
                   LIKES & COMMENTS
                   ============================================ */
        .social-row {
            display: flex;
            gap: 10px;
            margin: 6px 0 8px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .social-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }
        .social-btn .icon {
            font-size: 14px;
            transition: transform 0.2s;
        }
        .social-btn.liked {
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.08);
            color: #ec4899;
        }
        .social-btn.liked .icon {
            transform: scale(1.1);
        }
        .comment-count {
            font-size: 11px;
        }

        .comments-panel {
            display: none;
            margin: 6px 0 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        .comments-panel.open {
            display: block;
        }
        .comments-list {
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        .comment-item {
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-item strong {
            color: var(--text);
            font-weight: 600;
        }
        .comment-item .time {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.6;
            margin-left: 6px;
        }
        .comments-status {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 6px 0;
        }
        .comment-form {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .comment-form input {
            flex: 1;
            min-width: 80px;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 12px;
        }
        .comment-form input::placeholder {
            color: var(--text-muted);
        }
        .comment-form button {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .comment-form button:hover {
            background: #15803d;
        }

        /* ============================================
                   EVENT DETAIL MODAL
                   ============================================ */
        .event-detail-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(30px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .event-detail-overlay.open {
            display: flex;
        }
        .event-detail-box {
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 0;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .event-detail-box .detail-flyer {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 24px 24px 0 0;
        }
        .event-detail-box .detail-body {
            padding: 24px;
        }
        .event-detail-box .detail-body h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }
        .event-detail-box .detail-body .detail-organizer {
            color: #86efac;
            font-size: 14px;
            margin: 4px 0 12px;
        }
        .event-detail-box .detail-body .detail-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .event-detail-box .detail-body .detail-meta strong {
            color: var(--text);
        }
        .event-detail-box .detail-body .detail-price {
            font-size: 28px;
            font-weight: 800;
            color: #4ade80;
            margin: 16px 0;
        }
        .event-detail-box .detail-body .detail-description {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 12px 0 20px;
        }
        .event-detail-box .detail-close {
            position: sticky;
            top: 12px;
            right: 12px;
            float: right;
            z-index: 5;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            margin: 12px 12px 0 0;
            transition: background 0.2s;
        }
        .event-detail-box .detail-close:hover {
            background: rgba(0, 0, 0, 0.7);
        }
        .event-detail-box .detail-buy-btn {
            width: 100%;
            padding: 16px;
            background: #16a34a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .event-detail-box .detail-buy-btn:hover {
            background: #15803d;
        }
        .event-detail-box .detail-buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ============================================
                   LOADING & EMPTY
                   ============================================ */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .loading-state .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(74, 222, 128, 0.15);
            border-top-color: #86efac;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            grid-column: 1 / -1;
        }
        .empty-state .icon {
            font-size: 72px;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            color: var(--text);
            margin-bottom: 8px;
        }
        .empty-state p {
            color: var(--text-muted);
        }

        /* ============================================
                   CUSTOMER SERVICE
                   ============================================ */
        .cs-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5);
            animation: csPulse 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cs-toggle:hover {
            transform: scale(1.05);
        }
        @keyframes csPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5);
            }
            70% {

    <!-- ==========================================
    JAVASCRIPT – FULLY WORKING
    ========================================== -->
    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = "https://yfwxwqvksdsugxizaksj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_vvacDvbRi-H7XcBesuCmmw_rcTe6gwO";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🎉 EventFlow – Party Edition');

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const eventsContainer = document.getElementById('eventsContainer');
        const loadingState = document.getElementById('loadingState');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const viewBtns = document.querySelectorAll('.view-btn');

        const detailOverlay = document.getElementById('eventDetailOverlay');
        const detailCloseBtn = document.getElementById('detailCloseBtn');
        const detailFlyer = document.getElementById('detailFlyer');
        const detailTitle = document.getElementById('detailTitle');
        const detailOrganizer = document.getElementById('detailOrganizer');
        const detailVenue = document.getElementById('detailVenue');
        const detailDate = document.getElementById('detailDate');
        const detailCategory = document.getElementById('detailCategory');
        const detailPrice = document.getElementById('detailPrice');
        const detailDescription = document.getElementById('detailDescription');
        const detailBuyBtn = document.getElementById('detailBuyBtn');

        let allEvents = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let currentView = 'upcoming';
        const deviceId = getDeviceId();

        // ============================================
        // THEME TOGGLE
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('cf_theme') || 'dark';
        if (savedTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        themeToggle.textContent = savedTheme === 'light' ? '☀️' : '🌙';
        themeToggle.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const next = isLight ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next === 'light' ? 'light' : '');
            themeToggle.textContent = next === 'light' ? '☀️' : '🌙';
            localStorage.setItem('cf_theme', next);
        });

        // ============================================
        // DEVICE ID
        // ============================================
        function getDeviceId() {
            let id = localStorage.getItem('cf_device_id');
            if (!id) {
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'dev-' + Date.now() + '-' + Math
                    .random().toString(36).slice(2);
                localStorage.setItem('cf_device_id', id);
            }
            return id;
        }

        // ============================================
        // LOAD EVENTS
        // ============================================
        async function loadEvents() {
            try {
                console.log('📡 Fetching events...');
                const { data: events, error } = await sb
                    .from('events')
                    .select('*')
                    .eq('is_published', true)
                    .order('event_date', { ascending: true });

                if (error) throw error;

                console.log(`✅ Fetched ${events ? events.length : 0} events`);
                loadingState.style.display = 'none';

                if (!events || events.length === 0) {
                    eventsContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🎪</div>
                            <h3>No Events Yet!</h3>
                            <p>Be the first to create an event.</p>
                        </div>
                    `;
                    return;
                }

                allEvents = events;
                renderEvents(events);

            } catch (error) {
                console.error('❌ Error:', error);
                loadingState.style.display = 'none';
                eventsContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>Error Loading Events</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER EVENTS
        // ============================================
        function renderEvents(events) {
            const now = new Date();

            let filtered = events;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(e => e.category === currentCategory);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(e =>
                    e.title.toLowerCase().includes(q) ||
                    e.venue.toLowerCase().includes(q) ||
                    e.organizer_name.toLowerCase().includes(q)
                );
            }

            const upcoming = filtered.filter(e => new Date(e.event_date) >= now);
            const past = filtered.filter(e => new Date(e.event_date) < now);

            const listToShow = currentView === 'upcoming' ? upcoming : past;

            if (listToShow.length === 0) {
                eventsContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>${currentView === 'upcoming' ? 'No Upcoming Events' : 'No Past Events'}</h3>
                        <p>${currentView === 'upcoming' ? 'Check back later.' : 'Nothing here yet.'}</p>
                    </div>
                `;
                return;
            }

            const heading = currentView === 'upcoming' ?
                `<div class="section-title">🔥 Upcoming Events <span class="line"></span><span class="count-badge">${upcoming.length}</span></div>` :
                `<div class="section-title past">📅 Past Events <span class="line"></span><span class="count-badge">${past.length}</span></div>`;

            let html = heading + `<div class="events-grid" id="eventsGrid">`;

            listToShow.forEach(event => {
                html += createEventCard(event);
            });

            html += `</div>`;
            eventsContainer.innerHTML = html;

            // Attach click listeners to cards
            document.querySelectorAll('.event-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    // Ignore clicks on buttons inside
                    if (e.target.closest('.social-btn') || e.target.closest('.comment-form') || e.target
                        .closest('.comments-panel')) return;
                    const id = this.dataset.eventId;
                    if (id) openEventDetail(id);
                });
            });

            // Load social data for each event
            loadSocialData(listToShow.map(e => e.id));
        }

        // ============================================
        // CREATE EVENT CARD
        // ============================================
        function createEventCard(event) {
            const eventDate = new Date(event.event_date);
            const now = new Date();
            const isPast = eventDate < now;

            let statusClass = 'upcoming',
                statusText = 'Upcoming';
            if (isPast) {
                statusClass = 'past';
                statusText = 'Past';
            } else {
                const diffDays = Math.ceil((eventDate - now) / (1000 * 60 * 60 * 24));
                if (diffDays <= 0) {
                    statusClass = 'ongoing';
                    statusText = '🔥 Now!';
                } else if (diffDays <= 3) {
                    statusClass = 'ongoing';
                    statusText = `In ${diffDays}d`;
                } else {
                    statusText = `In ${diffDays}d`;
                }
            }

            let countdownText = '';
            if (!isPast) {
                const diffMs = eventDate - now;
                const hours = Math.floor(diffMs / (1000 * 60 * 60));
                if (hours < 48 && hours > 0) {
                    const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    countdownText = `${hours}h ${m}m`;
                }
            }

            const priceHtml = event.is_free ?
                `<span class="price free-price">FREE</span>` :
                `<span class="price">₦${event.price}</span>`;
            const feeHtml = event.is_free ?
                `<span class="fee-badge">No fee</span>` :
                `<span class="fee-badge">+ ₦100 fee</span>`;

            return `
                <div class="event-card" data-event-id="${event.id}" id="card-${event.id}">
                    <div class="flyer-wrap">
                        <img src="${event.banner_url || ''}" class="flyer" alt="${event.title}" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%230d2818%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%234ade80%22 font-size=%2240%22%3E🎉%3C/text%3E%3C/svg%3E'" />
                        <div class="flyer-overlay">
                            <span class="status-tag ${statusClass}">${statusText}</span>
                            ${countdownText ? `<span class="countdown">${countdownText}</span>` : ''}
                        </div>
                    </div>
                    <div class="info">
                        <div class="category-tag">${event.category || 'General'}</div>
                        <h3>${event.title}</h3>
                        <div class="organizer-tag">👤 ${event.organizer_name}</div>
                        <div class="meta"><span class="icon">📍</span> ${event.venue}</div>
                        <div class="meta"><span class="icon">📅</span> ${eventDate.toLocaleDateString()}</div>
                        <div class="price-row">${priceHtml}${feeHtml}</div>

                        <!-- Social: Likes & Comments -->
                        <div class="social-row">
                            <button class="social-btn" id="like-btn-${event.id}" onclick="toggleLike('${event.id}')">
                                <span class="icon">🤍</span>
                                <span id="like-count-${event.id}">0</span>
                            </button>
                            <button class="social-btn" onclick="toggleComments('${event.id}')">
                                💬 <span class="comment-count" id="comment-count-${event.id}">0</span>
                            </button>
                        </div>

                        <div class="comments-panel" id="comments-panel-${event.id}">
                            <div class="comments-list" id="comments-list-${event.id}">
                                <div class="comments-status">Loading comments...</div>
                            </div>
                            <form class="comment-form" onsubmit="return postComment(event, '${event.id}')">
                                <input type="text" placeholder="Your name" class="comment-name" maxlength="40" required />
                                <input type="text" placeholder="Say something..." class="comment-text" maxlength="200" required />
                                <button type="submit">Post</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================
        // SOCIAL DATA – LIKES & COMMENTS (FIXED)
        // ============================================
        async function loadSocialData(eventIds) {
            if (!eventIds.length) return;

            try {
                // ✅ Include device_id to check if current user liked
                const [likesRes, commentsRes] = await Promise.all([
                    sb.from('event_likes').select('event_id, device_id').in('event_id', eventIds),
                    sb.from('event_comments').select('event_id').in('event_id', eventIds)
                ]);

                const likes = likesRes.data || [];
                const comments = commentsRes.data || [];

                eventIds.forEach(id => {
                    const likeCount = likes.filter(l => l.event_id === id).length;
                    const commentCount = comments.filter(c => c.event_id === id).length;

                    const countEl = document.getElementById(`like-count-${id}`);
                    if (countEl) countEl.textContent = likeCount;

                    const commentCountEl = document.getElementById(`comment-count-${id}`);
                    if (commentCountEl) commentCountEl.textContent = commentCount;

                    // ✅ Check if this device already liked
                    const userLiked = likes.some(l => l.event_id === id && l.device_id === deviceId);
                    const btn = document.getElementById(`like-btn-${id}`);
                    if (btn) {
                        if (userLiked) {
                            btn.classList.add('liked');
                            btn.querySelector('.icon').textContent = '❤️';
                        } else {
                            btn.classList.remove('liked');
                            btn.querySelector('.icon').textContent = '🤍';
                        }
                    }

                    // Load comments for this event
                    loadCommentsForEvent(id);
                });

            } catch (err) {
                console.log('Social data load skipped:', err.message);
            }
        }

        // ============================================
        // LIKES
        // ============================================
        async function toggleLike(eventId) {
            const btn = document.getElementById(`like-btn-${eventId}`);
            const countEl = document.getElementById(`like-count-${eventId}`);
            const wasLiked = btn.classList.contains('liked');
            const currentCount = parseInt(countEl.textContent) || 0;

            // Optimistic UI
            btn.classList.toggle('liked');
            const icon = btn.querySelector('.icon');
            icon.textContent = wasLiked ? '🤍' : '❤️';
            countEl.textContent = wasLiked ? Math.max(0, currentCount - 1) : currentCount + 1;

            try {
                if (wasLiked) {
                    await sb.from('event_likes')
                        .delete()
                        .eq('event_id', eventId)
                        .eq('device_id', deviceId);
                } else {
                    await sb.from('event_likes')
                        .insert([{ event_id: eventId, device_id: deviceId }]);
                }
            } catch (err) {
                // Revert on error
                console.error('Like error:', err);
                btn.classList.toggle('liked');
                icon.textContent = wasLiked ? '❤️' : '🤍';
                countEl.textContent = currentCount;
            }
        }

        // ============================================
        // COMMENTS
        // ============================================
        function toggleComments(eventId) {
            const panel = document.getElementById(`comments-panel-${eventId}`);
            if (!panel) return;
            const isOpen = panel.classList.contains('open');
            panel.classList.toggle('open', !isOpen);
            if (!isOpen) {
                loadCommentsForEvent(eventId);
            }
        }

        async function loadCommentsForEvent(eventId) {
            const list = document.getElementById(`comments-list-${eventId}`);
            if (!list) return;

            try {
                const { data, error } = await sb
                    .from('event_comments')
                    .select('*')
                    .eq('event_id', eventId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const countEl = document.getElementById(`comment-count-${eventId}`);
                if (countEl) countEl.textContent = data ? data.length : 0;

                if (!data || data.length === 0) {
                    list.innerHTML = `<div class="comments-status">No comments yet — be the first!</div>`;
                    return;
                }

                list.innerHTML = data.map(c => `
                    <div class="comment-item">
                        <strong>${escapeHtml(c.name)}</strong>
                        <span class="time">${timeAgo(c.created_at)}</span>
                        <p>${escapeHtml(c.comment)}</p>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error loading comments:', err);
                list.innerHTML = `<div class="comments-status">Could not load comments.</div>`;
            }
        }

        async function postComment(e, eventId) {
            e.preventDefault();
            const form = e.target;
            const nameInput = form.querySelector('.comment-name');
            const textInput = form.querySelector('.comment-text');
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name || !text) return false;

            try {
                await sb.from('event_comments')
                    .insert([{ event_id: eventId, name: name, comment: text }]);

                nameInput.value = '';
                textInput.value = '';
                await loadCommentsForEvent(eventId);

                // Update comment count
                const countEl = document.getElementById(`comment-count-${eventId}`);
                if (countEl) {
                    const current = parseInt(countEl.textContent) || 0;
                    countEl.textContent = current + 1;
                }

            } catch (err) {
                console.error('Error posting comment:', err);
                alert('Could not post comment: ' + err.message);
            }
            return false;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function timeAgo(date) {
            if (!date) return '';
            const diff = Date.now() - new Date(date).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            const days = Math.floor(hrs / 24);
            return days + 'd ago';
        }

        // ============================================
        // EVENT DETAIL MODAL
        // ============================================
        function openEventDetail(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;

            detailFlyer.src = event.banner_url || '';
            detailTitle.textContent = event.title;
            detailOrganizer.textContent = '👤 ' + event.organizer_name;
            detailVenue.textContent = event.venue;
            detailDate.textContent = new Date(event.event_date).toLocaleString();
            detailCategory.textContent = event.category || 'General';
            detailDescription.textContent = event.description || 'No description provided.';

            if (event.is_free) {
                detailPrice.innerHTML = 'FREE <small>No ticket needed</small>';
                detailBuyBtn.textContent = '🎟️ RSVP Free';
            } else {
                detailPrice.innerHTML = `₦${event.price} <small>(+ ₦100 fee)</small>`;
                detailBuyBtn.textContent = '🎟️ Buy Ticket';
            }

            if (new Date(event.event_date) < new Date()) {
                detailBuyBtn.disabled = true;
                detailBuyBtn.textContent = '📅 Event Passed';
            } else {
                detailBuyBtn.disabled = false;
            }

            detailBuyBtn.dataset.eventId = event.id;
            detailOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeEventDetail() {
            detailOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        detailCloseBtn.addEventListener('click', closeEventDetail);
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeEventDetail();
        });

        detailBuyBtn.addEventListener('click', function() {
            const id = this.dataset.eventId;
            const event = allEvents.find(e => e.id === id);
            if (event) {
                closeEventDetail();
                if (event.is_free) {
                    window.location.href = `rsvp.html?eventId=${id}`;
                } else {
                    window.location.href = `payment.html?eventId=${id}`;
                }
            }
        });

        // ============================================
        // SEARCH & FILTERS
        // ============================================
        searchInput.addEventListener('input', function() {
            searchQuery = this.value;
            renderEvents(allEvents);
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                categoryBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderEvents(allEvents);
            });
        });

        viewBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.dataset.view === currentView) return;
                viewBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                renderEvents(allEvents);
            });
        });

        // ============================================
        // CUSTOMER SERVICE
        // ============================================
        const CS_ADMIN = '2348146275644';
        const CS_FAQ = [
            { keywords: ['ticket', 'buy', 'pay'], answer: 'Tap an event, fill in details, upload receipt, wait for admin confirmation.' },
            { keywords: ['free', 'rsvp'], answer: 'Free events only need your name and email — no payment.' },
            { keywords: ['submit', 'organizer', 'create'], answer: 'Use the "Submit Event" page. Save the private edit link you get.' },
            { keywords: ['edit', 'update'], answer: 'Use the private edit link. If lost, contact admin on WhatsApp.' },
            { keywords: ['pending', 'confirm'], answer: 'Pending means admin hasn\'t verified your payment yet. It auto-updates.' },
            { keywords: ['qr', 'scan', 'entry'], answer: 'Once payment is confirmed, a QR code appears on your confirmation page.' },
        ];

        function getCSAnswer(q) {
            const lower = q.toLowerCase();
            for (const entry of CS_FAQ) {
                if (entry.keywords.some(k => lower.includes(k))) return entry.answer;
            }
            return null;
        }

        const csToggle = document.getElementById('csToggle');
        const csPanel = document.getElementById('csPanel');
        const csClose = document.getElementById('csClose');
        const csMessages = document.getElementById('csMessages');
        const csForm = document.getElementById('csForm');
        const csInput = document.getElementById('csInput');

        csToggle.addEventListener('click', () => csPanel.classList.toggle('open'));
        csClose.addEventListener('click', () => csPanel.classList.remove('open'));

        csForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = csInput.value.trim();
            if (!msg) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'cs-message user';
            userDiv.textContent = msg;
            csMessages.appendChild(userDiv);
            csInput.value = '';
            csMessages.scrollTop = csMessages.scrollHeight;

            const answer = getCSAnswer(msg);
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'cs-message bot';
                if (answer) {
                    botDiv.textContent = answer;
                } else {
                    botDiv.innerHTML =
                        `I'm not sure. Contact admin on WhatsApp: <a href="https://wa.me/${CS_ADMIN}?text=${encodeURIComponent('Hi, I have a question: ' + msg)}" target="_blank" style="color:#22c55e; font-weight:700;">📱 Ask Admin</a>`;
                }
                csMessages.appendChild(botDiv);
                csMessages.scrollTop = csMessages.scrollHeight;
            }, 400);
        });

        // ============================================
        // START
        // ============================================
        loadEvents();
        setInterval(loadEvents, 60000);

        console.log('✅ EventFlow – Lively + Likes + Comments');
        console.log('❤️ Like events, 💬 comment, enjoy the party vibe!');
    </script>

</body>
</html>
