

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | CampusFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 24px 32px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #667eea;
        }
        .logo span {
            color: #764ba2;
        }
        .logout-btn {
            padding: 8px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
        }
        .stat-card .label {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }
        .stat-card.pending .number {
            color: #f59e0b;
        }
        .stat-card.approved .number {
            color: #10b981;
        }
        .stat-card.total .number {
            color: #667eea;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
            color: #6b7280;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .tab-btn:hover:not(.active) {
            background: #e5e7eb;
        }
        .event-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .event-card .flyer {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            background: #f3f4f6;
        }
        .event-card .info {
            flex: 1;
        }
        .event-card .info h3 {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 4px;
        }
        .event-card .info .meta {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .event-card .info .meta strong {
            color: #374151;
        }
        .event-card .info .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }
        .event-card .info .status.pending {
            background: #fef3c7;
            color: #92400e;
        }
        .event-card .info .status.approved {
            background: #d1fae5;
            color: #065f46;
        }
        .event-card .actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-approve {
            padding: 8px 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-approve:hover {
            background: #059669;
        }
        .btn-approve:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-delete {
            padding: 8px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #dc2626;
        }
        .btn-view {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-view:hover {
            background: #5b6fd8;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            color: #6b7280;
        }
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .login-box .logo {
            font-size: 32px;
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-box .error {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 12px;
            display: none;
        }
        @media (max-width: 600px) {
            .event-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .event-card .flyer {
                width: 100%;
                height: 160px;
            }
            .event-card .actions {
                justify-content: center;
                flex-wrap: wrap;
            }
            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-card .number {
                font-size: 24px;
            }
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="logo">Campus<span>Flow</span></div>
            <h3 style="margin-bottom: 20px; color: #374151;">Admin Access</h3>
            <div class="error" id="loginError">❌ Incorrect password</div>
            <input type="password" id="adminPassword" placeholder="Enter admin password" />
            <button id="loginBtn">🔐 Login</button>
            <p style="margin-top: 12px; font-size: 12px; color: #9ca3af;">Default password: <strong>admin123</strong></p>
        </div>
    </div>

    <!-- MAIN ADMIN -->
    <div class="container" id="adminContent" style="display:none;">
        <!-- Header -->
        <div class="header">
            <div class="logo">Campus<span>Flow</span> <span style="font-size:14px;color:#6b7280;font-weight:400;">Admin</span></div>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card pending">
                <div class="number" id="pendingCount">0</div>
                <div class="label">⏳ Pending</div>
            </div>
            <div class="stat-card approved">
                <div class="number" id="approvedCount">0</div>
                <div class="label">✅ Approved</div>
            </div>
            <div class="stat-card total">
                <div class="number" id="totalCount">0</div>
                <div class="label">📊 Total Events</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="pending" id="tabPending">⏳ Pending</button>
            <button class="tab-btn" data-tab="approved" id="tabApproved">✅ Approved</button>
            <button class="tab-btn" data-tab="all" id="tabAll">📊 All</button>
        </div>

        <!-- Events List -->
        <div id="eventsList"></div>
    </div>

    <script>
        // ============================================
        // SUPABASE CREDENTIALS
        // ============================================
        const SUPABASE_URL = 'https://yfwxwqvksdsugxizaksj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlmd3h3cXZrc2RzdWd4aXpha3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTA4NDcsImV4cCI6MjEwMTM2Njg0N30.Kp-rHr5Vr1p9-osaDK1fMj8i2e8mbaTMDnT6RoG2dPc';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentTab = 'pending';

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const loginOverlay = document.getElementById('loginOverlay');
        const adminContent = document.getElementById('adminContent');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminPassword = document.getElementById('adminPassword');
        const loginError = document.getElementById('loginError');
        const tabPending = document.getElementById('tabPending');
        const tabApproved = document.getElementById('tabApproved');
        const tabAll = document.getElementById('tabAll');

        // ============================================
        // LOGIN - FIXED
        // ============================================
        function doLogin() {
            const password = adminPassword.value;
            const ADMIN_PASSWORD = 'admin1234567'; // CHANGE THIS!

            if (password === ADMIN_PASSWORD) {
                loginOverlay.style.display = 'none';
                adminContent.style.display = 'block';
                loadEvents();
                loginError.style.display = 'none';
                adminPassword.value = '';
            } else {
                loginError.style.display = 'block';
                adminPassword.value = '';
            }
        }

        loginBtn.addEventListener('click', doLogin);

        adminPassword.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        // ============================================
        // LOGOUT
        // ============================================
        logoutBtn.addEventListener('click', function() {
            loginOverlay.style.display = 'flex';
            adminContent.style.display = 'none';
            adminPassword.value = '';
            loginError.style.display = 'none';
        });

        // ============================================
        // TABS - FIXED
        // ============================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            loadEvents();
        }

        tabPending.addEventListener('click', function() { switchTab('pending'); });
        tabApproved.addEventListener('click', function() { switchTab('approved'); });
        tabAll.addEventListener('click', function() { switchTab('all'); });

        // ============================================
        // LOAD EVENTS
        // ============================================
        async function loadEvents() {
            try {
                let query = supabase.from('events').select('*').order('created_at', { ascending: false });

                if (currentTab === 'pending') {
                    query = query.eq('is_published', false);
                } else if (currentTab === 'approved') {
                    query = query.eq('is_published', true);
                }

                const { data: events, error } = await query;

                if (error) throw error;

                // Update stats
                const allEvents = await supabase.from('events').select('is_published');
                const total = allEvents.data || [];
                const pending = total.filter(e => e.is_published === false).length;
                const approved = total.filter(e => e.is_published === true).length;

                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('approvedCount').textContent = approved;
                document.getElementById('totalCount').textContent = total.length;

                renderEvents(events || []);
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('eventsList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>Error loading events: ${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER EVENTS
        // ============================================
        function renderEvents(events) {
            const container = document.getElementById('eventsList');

            if (events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No events found in this category.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="event-card">
                    <img src="${event.banner_url || ''}" class="flyer" alt="${event.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23f3f4f6%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%239ca3af%22 font-size=%2220%22%3ENo Image%3C/text%3E%3C/svg%3E'" />
                    <div class="info">
                        <h3>${event.title}</h3>
                        <div class="meta"><strong>Venue:</strong> ${event.venue}</div>
                        <div class="meta"><strong>Date:</strong> ${new Date(event.event_date).toLocaleString()}</div>
                        <div class="meta"><strong>Price:</strong> ₦${event.price}</div>
                        <div class="meta"><strong>Organizer:</strong> ${event.organizer_name}</div>
                        <div class="meta"><strong>Bank:</strong> ${event.bank_account}</div>
                        <div class="meta"><strong>Submitted:</strong> ${new Date(event.created_at).toLocaleDateString()}</div>
                        <span class="status ${event.is_published ? 'approved' : 'pending'}">
                            ${event.is_published ? '✅ Approved' : '⏳ Pending'}
                        </span>
                        <div class="actions">
                            ${!event.is_published ? `
                                <button class="btn-approve" onclick="approveEvent('${event.id}')">✅ Approve</button>
                            ` : `
                                <span style="color:#10b981;font-weight:600;padding:8px 0;">✓ Approved</span>
                            `}
                            <button class="btn-delete" onclick="deleteEvent('${event.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // APPROVE EVENT
        // ============================================
        async function approveEvent(eventId) {
            if (!confirm('Approve this event? It will appear on the public website.')) return;

            try {
                const { error } = await supabase
                    .from('events')
                    .update({ is_published: true })
                    .eq('id', eventId);

                if (error) throw error;

                alert('✅ Event approved successfully!');
                loadEvents();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // DELETE EVENT
        // ============================================
        async function deleteEvent(eventId) {
            if (!confirm('⚠️ Delete this event permanently? This cannot be undone!')) return;

            try {
                const { error } = await supabase
                    .from('events')
                    .delete()
                    .eq('id', eventId);

                if (error) throw error;

                alert('🗑️ Event deleted successfully!');
                loadEvents();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // AUTO-REFRESH EVERY 30 SECONDS
        // ============================================
        setInterval(() => {
            if (adminContent.style.display !== 'none') {
                loadEvents();
            }
        }, 30000);

        console.log('🔐 CampusFlow Admin Panel ready!');
        console.log('🔑 Default password: admin123');
        console.log('📌 Change the password in the script (ADMIN_PASSWORD)');
    </script>

</body>
</html>
