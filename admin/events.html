

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusFlow | Event Management</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="events.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>CampusFlow</h2>

        <ul>

            <li onclick="window.location='dashboard.html'">

                📊 Dashboard

            </li>

            <li class="active">

                📅 Events

            </li>

            <li onclick="window.location='organizers.html'">

                👥 Organizers

            </li>

            <li onclick="window.location='settings.html'">

                ⚙ Settings

            </li>

            <li id="logoutBtn">

                🚪 Logout

            </li>

        </ul>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <div class="page-header">

            <div>

                <h1>Event Management</h1>

                <p>

                    Manage submitted events

                </p>

            </div>

        </div>


        <!-- FILTERS -->

        <div class="filter-bar">

            <input

                type="text"

                id="searchInput"

                placeholder="Search event title, venue or organizer..."

            >


            <select id="statusFilter">

                <option value="all">

                    All Events

                </option>

                <option value="pending">

                    Pending

                </option>

                <option value="approved">

                    Approved

                </option>

            </select>

        </div>


        <!-- TABLE -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Flyer</th>

                        <th>Title</th>

                        <th>Organizer</th>

                        <th>Venue</th>

                        <th>Date</th>

                        <th>Price</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="eventsTable">

                </tbody>

            </table>

        </div>

    </main>

    <script src="../js/events.js"></script>

</body>

</html>
