<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFlow Admin Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
</head>
<body>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-mark">CF</span>
            <span class="brand-name">CampusFlow</span>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a href="../payment-confirm.html" class="nav-item">
                <span class="nav-icon">💳</span> Payments
            </a>
            <a href="organizers.html" class="nav-item">
                <span class="nav-icon">👤</span> Organizers
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item ghost" target="_blank">
                <span class="nav-icon">🌐</span> View Live Site
            </a>
        </div>
    </aside>

    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Manage all submitted events</p>
            </div>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </header>

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <div class="stat-icon events">📋</div>
                <div class="stat-info">
                    <h3>Total Events</h3>
                    <h1 id="totalEvents">0</h1>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon pending">⏳</div>
                <div class="stat-info">
                    <h3>Pending</h3>
                    <h1 id="pendingEvents">0</h1>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon approved">✅</div>
                <div class="stat-info">
                    <h3>Approved</h3>
                    <h1 id="approvedEvents">0</h1>
                </div>
            </div>

            <div class="stat-card highlight">
                <div class="stat-icon viewers">👁️</div>
                <div class="stat-info">
                    <h3>Total Viewers</h3>
                    <h1 id="totalViewers">0</h1>
                    <p class="stat-sub">Every visit, including repeats</p>
                </div>
            </div>

            <div class="stat-card highlight">
                <div class="stat-icon users">📱</div>
                <div class="stat-info">
                    <h3>Unique Users</h3>
                    <h1 id="totalUsers">0</h1>
                    <p class="stat-sub">Distinct devices, counted once</p>
                </div>
            </div>
        </section>

        <!-- Search -->
        <section class="search-section">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by title, organizer or venue..." />
            </div>
        </section>

        <!-- Events -->
        <section class="events-section">
            <div class="section-heading">
                <h2>Submitted Events</h2>
                <span id="resultsCount" class="results-count"></span>
            </div>

            <div id="eventsContainer" class="events-grid"></div>
        </section>

    </main>

    <script src="../js/admin.js"></script>
</body>
</html>
