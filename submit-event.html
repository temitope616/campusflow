<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Event | CampusFlow</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ============================================
                   STYLES - MATCHING CAMPUSFLOW THEME
                   ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 4px;
        }

        .logo span {
            color: #764ba2;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            background: #fafafa;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
            position: relative;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f3f4ff;
        }

        .upload-area .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #6b7280;
            font-size: 14px;
        }

        .upload-area .filename {
            color: #667eea;
            font-weight: 600;
            margin-top: 8px;
        }

        #flyerInput {
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            position: relative;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .submit-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        /* Messages */
        .message {
            padding: 14px 16px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .message.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        /* Success State */
        .success-state {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .success-state .checkmark {
            font-size: 72px;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.2);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-state h2 {
            color: #065f46;
            margin: 16px 0 8px;
        }

        .success-state p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.5;
        }

        .success-state .event-id {
            background: #f3f4f6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
            margin-top: 12px;
            display: inline-block;
            font-family: monospace;
        }

        .reset-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: #e5e7eb;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #d1d5db;
        }

        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        small {
            color: #6b7280;
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
            .row-group {
                grid-template-columns: 1fr;
            }
            .logo {
                font-size: 24px;
            }
            input,
            textarea {
                font-size: 15px;
                padding: 11px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- LOGO -->
        <div class="logo">Campus<span>Flow</span></div>
        <p class="subtitle">🎪 Submit your campus event</p>

        <!-- ========================= -->
        <!-- FORM WRAPPER -->
        <!-- ========================= -->
        <div id="formWrapper">

            <form id="eventForm">

                <!-- Event Title -->
                <div class="form-group">
                    <label for="title">Event Title <span class="required">*</span></label>
                    <input type="text" id="title" placeholder="e.g., Tech Career Fair 2026" required />
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Describe your event..."></textarea>
                </div>

                <!-- Venue -->
                <div class="form-group">
                    <label for="venue">Venue <span class="required">*</span></label>
                    <input type="text" id="venue" placeholder="e.g., University Auditorium" required />
                </div>

                <!-- Date & Time -->
                <div class="form-group">
                    <label for="eventDate">Date &amp; Time <span class="required">*</span></label>
                    <input type="datetime-local" id="eventDate" required />
                </div>

                <!-- Price -->
                <div class="form-group">
                    <label for="price">Ticket Price (₦) <span class="required">*</span></label>
                    <input type="number" id="price" placeholder="0" min="0" step="100" required />
                    <small>Our service fee (₦100) will be added at checkout</small>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Event Category <span class="required">*</span></label>
                    <select id="category" required>
                        <option value="">Select a category...</option>
                        <option value="music">🎵 Music</option>
                        <option value="tech">💻 Tech</option>
                        <option value="sports">⚽ Sports</option>
                        <option value="social">🤝 Social</option>
                        <option value="academic">📚 Academic</option>
                    </select>
                </div>

                <!-- Organizer Name -->
                <div class="form-group">
                    <label for="organizer">Organizer Name <span class="required">*</span></label>
                    <input type="text" id="organizer" placeholder="e.g., Student Affairs Office" required />
                </div>

                <!-- Bank Details -->
                <div class="form-group">
                    <label>Bank Details for Payouts <span class="required">*</span></label>
                    <div class="row-group">
                        <input type="text" id="bankName" placeholder="Bank Name" required />
                        <input type="text" id="accountName" placeholder="Account Name" required />
                    </div>
                    <input type="text" id="accountNumber" placeholder="Account Number" style="margin-top:8px;" required />
                </div>

                <!-- Flyer Upload -->
                <div class="form-group">
                    <label>Event Flyer <span class="required">*</span></label>
                    <div class="upload-area" id="uploadArea">
                        <span class="icon">🖼️</span>
                        <p><strong>Click to upload</strong> or drag &amp; drop</p>
                        <p style="font-size:12px; color:#9ca3af;">PNG, JPG, JPEG up to 5MB</p>
                        <div class="filename" id="fileNameDisplay">No file selected</div>
                        <img id="previewImage" class="preview-image" alt="Flyer preview" />
                    </div>
                    <input type="file" id="flyerInput" accept="image/png,image/jpeg,image/jpg" />
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">🚀 Submit Event for Review</span>
                    <div class="spinner"></div>
                </button>

                <!-- Message Area -->
                <div class="message" id="message"></div>

            </form>

        </div>

        <!-- ========================= -->
        <!-- SUCCESS STATE -->
        <!-- ========================= -->
        <div class="success-state" id="successState">
            <div class="checkmark">✅</div>
            <h2>Event Submitted!</h2>
            <p>
                Your event is now pending review.<br />
                You'll be notified once it's approved.
            </p>
            <div class="event-id" id="submittedEventId"></div>
            <button class="reset-btn" id="resetBtn">Submit Another Event</button>
        </div>

    </div>

    <script>
        // ============================================
        // SUPABASE CONFIG - ONLY DECLARED ONCE
        // ============================================
        const SUPABASE_URL = 'https://yfwxwqvksdsugxizaksj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vvacDvbRi-H7XcBesuCmmw_rcTe6gwO';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('✅ CampusFlow Submission page ready!');

        // ============================================
        // DOM REFERENCES
        // ============================================
        const form = document.getElementById('eventForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');
        const successState = document.getElementById('successState');
        const submittedEventId = document.getElementById('submittedEventId');
        const resetBtn = document.getElementById('resetBtn');

        // Form inputs
        const titleInput = document.getElementById('title');
        const descriptionInput = document.getElementById('description');
        const venueInput = document.getElementById('venue');
        const dateInput = document.getElementById('eventDate');
        const priceInput = document.getElementById('price');
        const categoryInput = document.getElementById('category');
        const organizerInput = document.getElementById('organizer');
        const bankNameInput = document.getElementById('bankName');
        const accountNameInput = document.getElementById('accountName');
        const accountNumberInput = document.getElementById('accountNumber');

        // File upload elements
        const fileInput = document.getElementById('flyerInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const previewImage = document.getElementById('previewImage');

        // ============================================
        // STATE
        // ============================================
        let selectedFile = null;

        // ============================================
        // FILE UPLOAD HANDLING
        // ============================================

        // Click upload area to trigger file input
        uploadArea.addEventListener('click', function() {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            // Validate file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('❌ File too large! Maximum size is 5MB.');
                this.value = '';
                return;
            }

            // Validate file type
            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            if (!validTypes.includes(file.type)) {
                alert('❌ Please upload a PNG or JPG image.');
                this.value = '';
                return;
            }

            // Save the file
            selectedFile = file;
            fileNameDisplay.textContent = '✅ ' + file.name;
            fileNameDisplay.style.color = '#10b981';

            // Show preview
            const reader = new FileReader();
            reader.onload = function() {
                previewImage.src = reader.result;
                previewImage.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Clear any previous messages
            hideMessage();
        });

        // Drag and drop support
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#667eea';
            this.style.background = '#f3f4ff';
        });

        uploadArea.addEventListener('dragleave', function() {
            this.style.borderColor = '#d1d5db';
            this.style.background = '#fafafa';
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#d1d5db';
            this.style.background = '#fafafa';

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];

                // Validate file size
                if (file.size > 5 * 1024 * 1024) {
                    alert('❌ File too large! Maximum size is 5MB.');
                    return;
                }

                // Validate file type
                const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
                if (!validTypes.includes(file.type)) {
                    alert('❌ Please upload a PNG or JPG image.');
                    return;
                }

                selectedFile = file;
                fileNameDisplay.textContent = '✅ ' + file.name;
                fileNameDisplay.style.color = '#10b981';

                const reader = new FileReader();
                reader.onload = function() {
                    previewImage.src = reader.result;
                    previewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);

                hideMessage();
            }
        });

        // ============================================
        // FORM SUBMISSION
        // ============================================
        form.addEventListener('submit', async function(e) {
            // ✅ PREVENT PAGE REFRESH
            e.preventDefault();

            console.log('📝 Form submitted');

            // Validate file
            if (!selectedFile) {
                showMessage('Please upload an event flyer.', 'error');
                return;
            }

            // Gather form data
            const formData = {
                title: titleInput.value.trim(),
                description: descriptionInput.value.trim(),
                venue: venueInput.value.trim(),
                event_date: dateInput.value,
                price: parseFloat(priceInput.value) || 0,
                category: categoryInput.value,
                organizer_name: organizerInput.value.trim(),
                bank_name: bankNameInput.value.trim(),
                account_name: accountNameInput.value.trim(),
                account_number: accountNumberInput.value.trim(),
            };

            // Validate required fields
            if (!formData.title || !formData.venue || !formData.event_date ||
                !formData.organizer_name || !formData.category ||
                !formData.bank_name || !formData.account_name || !formData.account_number) {
                showMessage('Please fill in all required fields.', 'error');
                return;
            }

            console.log('📋 Event Data:', formData);

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            hideMessage();

            try {
                // ============================================
                // STEP 1: Upload image to Supabase Storage
                // ============================================
                console.log('📤 Uploading image...');

                const fileExt = selectedFile.name.split('.').pop();
                const uploadFileName = 'flyer-' + Date.now() + '.' + fileExt;
                const filePath = 'flyers/' + uploadFileName;

                console.log('📤 File path:', filePath);

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('event-posters')
                    .upload(
                        filePath,
                        selectedFile, {
                            cacheControl: '3600',
                            upsert: false
                        }
                    );

                if (uploadError) {
                    console.error('❌ UPLOAD ERROR:', uploadError);
                    throw new Error('Image upload failed: ' + uploadError.message);
                }

                console.log('✅ IMAGE UPLOADED:', uploadData);

                // ============================================
                // STEP 2: Get public URL
                // ============================================
                const { data: urlData } = supabaseClient.storage
                    .from('event-posters')
                    .getPublicUrl(filePath);

                const bannerUrl = urlData.publicUrl;
                console.log('🔗 Public URL:', bannerUrl);

                // ============================================
                // STEP 3: Save event to database
                // ============================================
                console.log('💾 Saving event to database...');
                const eventData = {
                    title: formData.title,
                    description: formData.description || null,
                    venue: formData.venue,
                    event_date: formData.event_date,
                    price: formData.price,
                    category: formData.category,
                    organizer_name: formData.organizer_name,
                    bank_name: formData.bank_name,
                    account_name: formData.account_name,
                    account_number: formData.account_number,
                    banner_url: bannerUrl,
                    is_published: false,
                };

                const { data: insertedEvent, error: insertError } = await supabaseClient
                    .from('events')
                    .insert([eventData])
                    .select()
                    .single();

                if (insertError) {
                    console.error('❌ Database error:', insertError);
                    throw new Error('Database error: ' + insertError.message);
                }
                console.log('✅ Event saved! ID:', insertedEvent.id);

                // ============================================
                // STEP 4: Show success
                // ============================================
                submittedEventId.textContent = '📋 Event ID: ' + insertedEvent.id;
                form.style.display = 'none';
                successState.style.display = 'block';
                console.log('🎉 Success! Event submitted!');

            } catch (error) {
                console.error('❌ Error:', error);
                showMessage(error.message || 'Something went wrong. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        // ============================================
        // RESET FORM
        // ============================================
        resetBtn.addEventListener('click', function() {
            console.log('🔄 Reset form');

            // Hide success, show form
            successState.style.display = 'none';
            form.style.display = 'block';

            // Reset all form fields
            form.reset();

            // Reset file input
            fileInput.value = '';
            selectedFile = null;
            fileNameDisplay.textContent = 'No file selected';
            fileNameDisplay.style.color = '#6b7280';
            previewImage.style.display = 'none';

            // Reset submit button
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');

            // Clear messages
            hideMessage();

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        // Show message
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        // Hide message
        function hideMessage() {
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        // ============================================
        // SET DEFAULT DATE (7 days from now)
        // ============================================
        (function setDefaultDate() {
            const now = new Date();
            now.setDate(now.getDate() + 7);

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            dateInput.value = year + '-' + month + '-' + day + 'T' + hours + ':' + minutes;
        })();

        // ============================================
        // CONSOLE LOGS FOR DEBUGGING
        // ============================================
        console.log('✅ CampusFlow Submission page ready!');
        console.log('📌 Click the upload area to select an image');
        console.log('📌 Form will NOT refresh on submit');
    </script>

</body>
</html>
